name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            g++ \
            cmake \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools \
            libgl1-mesa-dev \
            clang-format \
            clang-tidy \
            dpkg-dev \
            dbus \
            file \
            python3

      - name: Check formatting
        run: |
          find src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: clang-tidy
        run: |
          mapfile -t sources < <(find src tests -type f -name '*.cpp' | sort)
          clang-tidy -p build --warnings-as-errors='*' "${sources[@]}"

      - name: Package
        run: cpack -G DEB --config build/CPackConfig.cmake

      - name: Check Debian dependencies
        run: |
          deb=$(echo build/controld-tray_*_ubuntu24.04_amd64.deb)
          test "$(dpkg-deb -f "$deb" Version)" = "1.0.0"
          test "$(dpkg-deb -f "$deb" Package)" = "controld-tray"
          depends=$(dpkg-deb -f "$deb" Depends)
          printf '%s\n' "$depends"
          printf '%s\n' "$depends" | grep -q 'libqt6core6t64'
          printf '%s\n' "$depends" | grep -q 'libqt6gui6t64'
          printf '%s\n' "$depends" | grep -q 'libqt6dbus6t64'
          if printf '%s\n' "$depends" | grep -E 'libqt6(core|gui|dbus|widgets|network)6( |,|\()'; then
            echo "Depends names a Qt library without Ubuntu 24.04's t64 suffix" >&2
            exit 1
          fi
          if printf '%s\n' "$depends" | grep -E '>= 6\.(8|9|10)'; then
            echo "Depends requires a Qt newer than Ubuntu 24.04" >&2
            exit 1
          fi

      - name: Install the package in a clean Ubuntu 24.04 container
        run: |
          deb=$(echo build/controld-tray_*_ubuntu24.04_amd64.deb)
          docker run --rm -v "$PWD/$deb:/tmp/controld-tray.deb:ro" ubuntu:24.04 \
            bash -eux -c '
              export DEBIAN_FRONTEND=noninteractive
              if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
                sed -i "s/Components: main$/Components: main universe/" /etc/apt/sources.list.d/ubuntu.sources
              fi
              apt-get update
              apt-get install -y --no-install-recommends /tmp/controld-tray.deb
              test "$(controld-tray --version)" = "controld-tray 1.0.0"
            '

      - uses: actions/upload-artifact@v4
        with:
          name: controld-tray-ubuntu24.04-deb
          path: build/controld-tray_*_ubuntu24.04_amd64.deb
          if-no-files-found: error

  appimage:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Install build packages
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            g++ \
            cmake \
            ninja-build \
            pkg-config \
            ca-certificates \
            curl \
            xz-utils \
            file \
            patchelf \
            git \
            desktop-file-utils \
            libfuse2 \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libdbus-1-dev \
            dbus \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrender-dev \
            libxcb1-dev \
            libxcb-glx0-dev \
            libxcb-keysyms1-dev \
            libxcb-image0-dev \
            libxcb-shm0-dev \
            libxcb-icccm4-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            zlib1g-dev \
            libssl-dev \
            python3

      - uses: actions/checkout@v4

      - name: Install Python for aqtinstall
        run: |
          curl -fL --retry 3 -o /tmp/python.tgz \
            https://github.com/astral-sh/python-build-standalone/releases/download/20261110/cpython-3.11.18%2B20261110-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz
          mkdir -p /opt/python-standalone
          tar -xzf /tmp/python.tgz -C /opt/python-standalone
          /opt/python-standalone/python/bin/python3 -m pip install 'aqtinstall==3.3.0'

      - name: Cache Qt
        uses: actions/cache@v4
        id: qt-cache
        with:
          path: ${{ github.workspace }}/qt
          key: qt-6.4.3-gcc_64

      - name: Install Qt 6.4.3
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: /opt/python-standalone/python/bin/aqt install-qt linux desktop 6.4.3 gcc_64 --outputdir "${GITHUB_WORKSPACE}/qt"

      - name: Build AppImage
        run: |
          export QT_ROOT="${GITHUB_WORKSPACE}/qt/6.4.3/gcc_64"
          test -x "$QT_ROOT/bin/qmake"
          packaging/build-appimage.sh
        env:
          QT_QPA_PLATFORM: offscreen

      - uses: actions/upload-artifact@v4
        with:
          name: controld-tray-x86_64-AppImage
          path: controld-tray-x86_64.AppImage
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.AppImage
          fail_on_unmatched_files: true
